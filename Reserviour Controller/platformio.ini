; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s2_tft]
platform = espressif32
board = adafruit_feather_esp32s2_tft
framework = arduino
lib_deps = 
	pstolarz/OneWireNg @ ^0.14.1
	adafruit/Adafruit AHTX0@^2.0.6
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	knolleary/PubSubClient@^2.8

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; Force the build system to generate debug symbols
build_type = debug

; Use the built-in USB JTAG hardware
debug_tool = esp-builtin

lib_deps = 
	pstolarz/OneWireNg @ ^0.14.1
	adafruit/Adafruit AHTX0@^2.0.6
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	knolleary/PubSubClient@^2.8
